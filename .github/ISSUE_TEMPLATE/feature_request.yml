name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you expect. Sketches and mockups are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SIP analysis
        - Media / audio
        - Diagnostics
        - Live capture
        - Transcription
        - Export / reporting
        - UI / UX
        - Performance
        - Other
